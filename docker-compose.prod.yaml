# Log rotation, also set host-wide by infra/vps/20-docker.sh: repeated here so
# a server provisioned some other way can't fill its disk with container logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    logging: *logging
    restart: unless-stopped
    image: ${IMAGE_PREFIX}/ric-backend:latest
    expose:
      - ${BACKEND_PORT}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PORT=${BACKEND_PORT}
      - METABASE_SITE_URL=${METABASE_SITE_URL}
      - METABASE_SECRET_KEY=${METABASE_SECRET_KEY}
      - METABASE_DASHBOARD_ID=${METABASE_DASHBOARD_ID}
    networks:
      - web

  frontend:
    logging: *logging
    restart: unless-stopped
    image: ${IMAGE_PREFIX}/ric-frontend:latest
    expose:
      - ${FRONTEND_PORT}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=http://backend:${BACKEND_PORT}
    depends_on:
      - backend
    networks:
      - web

  nginx:
    logging: *logging
    restart: unless-stopped
    image: ${IMAGE_PREFIX}/ric-nginx:latest
    build:
      context: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Only prod.conf: mounting the whole nginx/ folder would also load
      # preview.conf, whose certificate doesn't exist here, and nginx would
      # refuse to start.
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - web

  certbot:
    logging: *logging
    image: ${IMAGE_PREFIX}/ric-certbot:latest
    build:
      context: ./certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/logs:/var/log/letsencrypt
    depends_on:
      - nginx
    networks:
      - web

networks:
  web:
    driver: bridge
