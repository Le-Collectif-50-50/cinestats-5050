# Log rotation, also set host-wide by infra/vps/20-docker.sh: repeated here so
# a server provisioned some other way can't fill its disk with container logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    logging: *logging
    restart: unless-stopped
    image: ${IMAGE_PREFIX}/ric-backend:${IMAGE_TAG:?set by the deploy workflow}
    expose:
      - ${BACKEND_PORT}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PORT=${BACKEND_PORT}
      - METABASE_SITE_URL=${METABASE_SITE_URL}
      - METABASE_SECRET_KEY=${METABASE_SECRET_KEY}
      - METABASE_DASHBOARD_ID=${METABASE_DASHBOARD_ID}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - web

  frontend:
    logging: *logging
    restart: unless-stopped
    image: ${IMAGE_PREFIX}/ric-frontend:${IMAGE_TAG:?set by the deploy workflow}
    expose:
      - ${FRONTEND_PORT}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=http://backend:${BACKEND_PORT}
    # A static file: checks that next is serving without depending on the API.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - backend
    networks:
      - web

  nginx:
    logging: *logging
    restart: unless-stopped
    image: ${IMAGE_PREFIX}/ric-nginx:${IMAGE_TAG:?set by the deploy workflow}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Only prod.conf: mounting the whole nginx/ folder would also load
      # preview.conf, whose certificate doesn't exist here, and nginx would
      # refuse to start.
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - web

  certbot:
    logging: *logging
    image: ${IMAGE_PREFIX}/ric-certbot:${IMAGE_TAG:?set by the deploy workflow}
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/logs:/var/log/letsencrypt
    depends_on:
      - nginx
    networks:
      - web

networks:
  web:
    driver: bridge
