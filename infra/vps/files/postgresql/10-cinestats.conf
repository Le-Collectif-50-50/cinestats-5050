# Installé par infra/vps/30-postgres.sh (chargé via include_dir = 'conf.d').
listen_addresses = '@LISTEN_ADDRESSES@'

ssl = on
ssl_cert_file = '/etc/postgresql/@PG_VERSION@/main/ssl/server.crt'
ssl_key_file = '/etc/postgresql/@PG_VERSION@/main/ssl/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'

# Traçabilité : qui se connecte, d'où, et les requêtes lentes.
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d %h '
log_min_duration_statement = '2s'
