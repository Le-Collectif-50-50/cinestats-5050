# Installé par infra/vps/40-pgbackrest.sh : archivage continu des WAL (PITR).
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
# Force un segment WAL au moins toutes les 15 min s'il y a eu des écritures :
# borne la perte de données maximale (RPO) même quand la base écrit peu.
archive_timeout = 900
