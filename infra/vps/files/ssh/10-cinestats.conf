# Durcissement SSH cinestats-5050, installé par infra/vps/00-base.sh.
# Lu avant 50-cloud-init.conf : pour sshd, la première valeur lue l'emporte.
Port @SSH_PORT@
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowGroups ssh-users
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
# « local » sur data (tunnels ssh -L vers les UIs Airbyte/Prefect), « no » ailleurs.
AllowTcpForwarding @ALLOW_TCP_FORWARDING@
ClientAliveInterval 300
ClientAliveCountMax 2
