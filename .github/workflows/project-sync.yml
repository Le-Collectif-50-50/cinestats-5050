name: Project sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simuler sans modifier les Projects
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: project-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vérifier les identifiants dédiés
        env:
          APP_ID: ${{ secrets.PROJECTS_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo '::error::Configurer PROJECTS_APP_ID et PROJECTS_APP_PRIVATE_KEY. Voir docs/runbooks/github-projects.md.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.PROJECTS_APP_ID }}
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: Le-Collectif-50-50
          repositories: |
            cinestats-5050
            cinestats-infra
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read
      - uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const sync = require('./.github/scripts/project-sync.cjs');
            await sync({github, core, dryRun: process.env.DRY_RUN === 'true'});
