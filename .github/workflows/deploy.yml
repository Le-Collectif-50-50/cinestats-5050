name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # NOTE: this job is duplicated (with a different matrix/tag/build-args) in
  # deploy-preview.yml. It was extracted into a reusable workflow at one
  # point (build-push-images.yml, workflow_call) to remove that duplication,
  # but reusable-workflow calls fail with a startup_failure on this repo
  # (org-level Actions policy, most likely — not something fixable from the
  # repo side). Reverted back to inline; revisit if that policy ever changes.
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            image: ric-backend
            context: .
            file: ./backend/Dockerfile.prod
          - name: frontend
            image: ric-frontend
            context: ./frontend
            file: ./frontend/Dockerfile.prod
          - name: nginx
            image: ric-nginx
            context: ./nginx
            file: ./nginx/Dockerfile
          - name: certbot
            image: ric-certbot
            context: ./certbot
            file: ./certbot/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.name == 'frontend' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL) || '' }}
            ${{ matrix.name == 'frontend' && 'NEXT_PUBLIC_UMAMI_WEBSITE_ID=996668f1-b9bd-4892-974d-b9a0bb145082' || '' }}
            ${{ matrix.name == 'frontend' && 'NEXT_PUBLIC_ALLOW_ROBOTS_INDEXING=true' || '' }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker compose prod file via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SERVER_PORT }}
          source: "docker-compose.prod.yaml"
          target: ~/cinestats5050

      - name: Copy nginx config via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SERVER_PORT }}
          source: "nginx"
          target: ~/cinestats5050

      - name: Copy certbot scaffolding via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SERVER_PORT }}
          source: "certbot"
          target: ~/cinestats5050

      - name: Copy deploy script via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SERVER_PORT }}
          source: "scripts"
          target: ~/cinestats5050

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SERVER_PORT }}
          script: |
            cd ~/cinestats5050
            mkdir -p certbot/conf certbot/www certbot/logs
            echo "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" > .env
            echo "BACKEND_PORT=${{ vars.BACKEND_PORT }}" >> .env
            echo "FRONTEND_PORT=${{ vars.FRONTEND_PORT }}" >> .env
            echo "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}" >> .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "IMAGE_PREFIX=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> .env
            echo "METABASE_SITE_URL=${{ secrets.METABASE_SITE_URL }}" >> .env
            echo "METABASE_SECRET_KEY=${{ secrets.METABASE_SECRET_KEY }}" >> .env
            echo "METABASE_DASHBOARD_ID=${{ secrets.METABASE_DASHBOARD_ID }}" >> .env

            chmod +x scripts/remote-deploy.sh
            GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}" GITHUB_TOKEN="${{ github.token }}" ./scripts/remote-deploy.sh docker-compose.prod.yaml --down
