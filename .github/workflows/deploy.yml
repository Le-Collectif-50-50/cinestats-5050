name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/build-push-images.yml
    with:
      environment: production
      image-tag: latest
      include-umami: true
      matrix-json: >-
        [
          {"name":"backend","image":"ric-backend","context":".","file":"./backend/Dockerfile.prod"},
          {"name":"frontend","image":"ric-frontend","context":"./frontend","file":"./frontend/Dockerfile.prod"},
          {"name":"nginx","image":"ric-nginx","context":"./nginx","file":"./nginx/Dockerfile"},
          {"name":"certbot","image":"ric-certbot","context":"./certbot","file":"./certbot/Dockerfile"}
        ]
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker compose prod file via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yaml"
          target: ~/cinestats5050

      - name: Copy nginx config via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx"
          target: ~/cinestats5050

      - name: Copy certbot scaffolding via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "certbot"
          target: ~/cinestats5050

      - name: Copy deploy script via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "scripts"
          target: ~/cinestats5050

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/cinestats5050
            mkdir -p certbot/conf certbot/www certbot/logs
            echo "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" > .env
            echo "BACKEND_PORT=${{ vars.BACKEND_PORT }}" >> .env
            echo "FRONTEND_PORT=${{ vars.FRONTEND_PORT }}" >> .env
            echo "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}" >> .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "IMAGE_PREFIX=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> .env
            echo "METABASE_SITE_URL=${{ secrets.METABASE_SITE_URL }}" >> .env
            echo "METABASE_SECRET_KEY=${{ secrets.METABASE_SECRET_KEY }}" >> .env
            echo "METABASE_DASHBOARD_ID=${{ secrets.METABASE_DASHBOARD_ID }}" >> .env

            chmod +x scripts/remote-deploy.sh
            GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}" GITHUB_TOKEN="${{ github.token }}" ./scripts/remote-deploy.sh docker-compose.prod.yaml --down
