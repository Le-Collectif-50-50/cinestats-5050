name: Issue status checks

on:
  pull_request:
    paths:
      - '.github/scripts/issue-status*'
      - '.github/workflows/issue-status*.yml'
      - '.github/scripts/project-*'
      - '.github/projects.json'
      - '.github/workflows/project-sync.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue-status*'
      - '.github/workflows/issue-status*.yml'
      - '.github/scripts/project-*'
      - '.github/projects.json'
      - '.github/workflows/project-sync.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test .github/scripts/issue-status.test.cjs .github/scripts/project-sync.test.cjs
