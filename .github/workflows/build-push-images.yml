name: Build and Push Images

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to run the job under (production/preview)
        required: true
        type: string
      image-tag:
        description: "Raw docker/metadata-action tag to apply (e.g. latest, preview)"
        required: true
        type: string
      matrix-json:
        description: JSON array of {name, image, context, file} build targets
        required: true
        type: string
      include-umami:
        description: Whether to bake the production Umami website id into the frontend build
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include: ${{ fromJson(inputs.matrix-json) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.image-tag }}
            type=sha

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.name == 'frontend' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL) || '' }}
            ${{ matrix.name == 'frontend' && inputs.include-umami && 'NEXT_PUBLIC_UMAMI_WEBSITE_ID=996668f1-b9bd-4892-974d-b9a0bb145082' || '' }}
