server {
    listen 80;
    server_name preview.cinestats5050.fr api.preview.cinestats5050.fr;

    # No /.well-known/acme-challenge/ location here: certificates are issued
    # via DNS-01 (certbot/dns-ovh), so port 80 only needs to redirect.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.preview.cinestats5050.fr;

    ssl_certificate /etc/letsencrypt/live/preview.cinestats5050.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.cinestats5050.fr/privkey.pem;

    include /etc/nginx/conf.d/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name preview.cinestats5050.fr;

    ssl_certificate /etc/letsencrypt/live/preview.cinestats5050.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.cinestats5050.fr/privkey.pem;

    include /etc/nginx/conf.d/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
