version: 2

models:
  - name: film_credits_unmatched
    description: >
      Quarantaine des crédits sans correspondance film. Ces lignes restent
      disponibles pour revue mais sont exclues de fnl_film_credits.
      Le test film_credits_unmatched_review les signale sans bloquer le build.
    columns:
      - name: allocine_id
        description: Identifiant Allociné retourné par le scraper, absent du matching.
      - name: credit_holder_id
        description: Identifiant de la personne ou société créditée.
      - name: role_id
        description: Identifiant du rôle.
      - name: type
        description: Personne ou société.
      - name: full_name
        description: Nom de la personne créditée.
      - name: legal_name
        description: Raison sociale de la société créditée.
      - name: role
        description: Libellé du rôle.
      - name: source_visas
        description: Visas CNC des entrées de scraping associées à cet identifiant.
      - name: source_titles
        description: Titres CNC des entrées de scraping associées à cet identifiant.

  - name: v_allocine_pipeline_status
    config:
      tags: ["phase2"]
    description: >
      Vue de monitoring des tentatives de scraping Allocine,
      exposée dans le schéma `ops` pour Metabase.
    columns:
      - name: extracted_date
        description: Date UTC de l'extraction.
        tests:
          - not_null
      - name: extracted_hour
        description: Heure UTC de l'extraction, de 0 a 23.
        tests:
          - not_null
      - name: extracted_ts
        description: Horodatage brut de l'extraction.
        tests:
          - not_null
      - name: run_id
        description: Identifiant du run de scraping.
      - name: cnc_visa
        description: Visa CNC du film.
      - name: source_record_id
        description: Identifiant de la ligne source du scraping.
        tests:
          - not_null
      - name: scrapping_status
        description: Statut du scraping pour cette tentative.
      - name: match_strategy
        description: Strategie de matching utilisee.
      - name: record_hash
        description: Hash technique de la tentative.
      - name: error_message
        description: Message d'erreur remonte par le scraper en cas d'echec.
