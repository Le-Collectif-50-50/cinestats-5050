name: ric
version: 1.0.0
config-version: 2

profile: ric

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  ric:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +tags: [phase2]
      +materialized: view
      +schema: intermediate
    fnl:
      +tags: [phase2]
      +materialized: table
      +schema: fnl
    ops:
      +materialized: view
      +schema: ops
      +grants:
        select: [metabase_ops_user]

on-run-end:
  - "{{ persist_dbt_results(results) }}"

seeds:
  ric:
    +schema: ops
    +tags: [phase2]
    +grants:
      select: [metabase_ops_user]
    allocine_association_rejections:
      +column_types:
        source_record_id: text
        visa_number: text
        allocine_id: text
        evidence_run_id: text
        evidence_record_hash: text
        reviewed_at: date
    cnc_broadcaster_aliases:
      +column_types:
        priority: integer
        alias_pattern: text
        broadcaster_name: text
        is_excluded: boolean
