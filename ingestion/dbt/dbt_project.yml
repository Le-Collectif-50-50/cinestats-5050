name: ric
version: 1.0.0
config-version: 2

profile: ric

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  ric:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +tags: [phase2]
      +materialized: view
      +schema: intermediate
    fnl:
      +tags: [phase2]
      +materialized: table
      +schema: fnl
    ops:
      +materialized: view
      +schema: ops
      +grants:
        select: [metabase_ops_user]
